name: Android CI

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Verify i18n, Unit Tests, Lint & Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify 13-locale i18n, XML integrity, privacy boundary, and zero TODOs
        run: python3 android/scripts/verify-i18n.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Generate ephemeral CI keystore for release AAB signing check
        run: |
          keytool -genkeypair \
            -keystore "${{ runner.temp }}/ci-ephemeral.jks" \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -alias yaytif-ci \
            -storepass "ci-ephemeral-pass" \
            -keypass "ci-ephemeral-pass" \
            -dname "CN=Yaytif CI Verification, O=Yaytif, C=US"

      - name: Run unit tests, Android Lint, debug APK, and signed release AAB
        working-directory: android
        env:
          YAYTIF_KEYSTORE_PATH: ${{ runner.temp }}/ci-ephemeral.jks
          YAYTIF_KEYSTORE_PASSWORD: ci-ephemeral-pass
          YAYTIF_KEY_ALIAS: yaytif-ci
          YAYTIF_KEY_PASSWORD: ci-ephemeral-pass
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Verify signed release AAB and R8 mapping file
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          MAPPING_PATH="android/app/build/outputs/mapping/release/mapping.txt"
          test -f "$AAB_PATH"
          test -f "$MAPPING_PATH"
          VERIFY_OUT="$(jarsigner -verify -certs "$AAB_PATH")"
          echo "$VERIFY_OUT" | head -n 40
          echo "$VERIFY_OUT" | grep -q "jar verified."

      - name: Clean up ephemeral CI keystore
        if: always()
        run: rm -f "${{ runner.temp }}/ci-ephemeral.jks"

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
